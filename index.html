<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My GitHub Project</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }

    section {
      background-color: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px 15px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Project</h1>
  <p>This is a simple webpage for my GitHub assessment.</p>

  <!-- New About Section -->
  <section>
    <h2>About This Project</h2>
    <p>This project demonstrates how to use branches and pull requests in GitHub.</p>
  </section>

  <!-- New Features Section -->
  <section>
    <h2>Features</h2>
    <ul>
      <li>Branch creation</li>
      <li>Pull request practice</li>
      <li>Simple UI design</li>
    </ul>
  </section>

  <!-- JavaScript Interaction -->
  <button onclick="showMessage()">Click Me</button>

  <script>
    function showMessage() {
      alert("Hello! This button uses JavaScript interaction.");
    }
  </script>

</body>
</html>
